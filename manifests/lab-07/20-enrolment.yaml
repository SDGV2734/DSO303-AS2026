apiVersion: v1
kind: ConfigMap
metadata:
  name: usms-enrolment-conf
  namespace: usms
  labels:
    app: usms-enrolment
data:
  default.conf.template: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location / {
        add_header Content-Type application/json;
        return 200 '{"service":"usms-enrolment","pod":"${POD_NAME}","node":"${NODE_NAME}","env":"${APP_ENVIRONMENT}","version":"${APP_VERSION}"}\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
    project: usms
    tier: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: usms-enrolment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: usms-enrolment
        project: usms
        tier: app
    spec:
      # Exercise 4 - never put all enrolment capacity on one node.
      # ADVISORY: spread pods evenly across nodes (hostname); ScheduleAnyway so a
      # one-node cluster can still run both replicas instead of leaving one Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: usms-enrolment
      # ADVISORY: prefer not to co-locate two enrolment pods on the same node.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: usms-enrolment
      containers:
        - name: enrolment
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Added in Step 17 by `kubectl set env --from=secret/usms-enrolment-secret`
            # (kubectl v1.36 writes one secretKeyRef per key rather than envFrom.secretRef).
            # Kept here so this file matches the live Deployment.
            - name: ENROLMENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: usms-enrolment-secret
                  key: ENROLMENT_API_TOKEN
            - name: ENROLMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usms-enrolment-secret
                  key: ENROLMENT_DB_PASSWORD
          envFrom:
            - configMapRef:
                name: usms-app-config
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: conf
          configMap:
            name: usms-enrolment-conf
---
apiVersion: v1
kind: Service
metadata:
  name: usms-enrolment
  namespace: usms
  labels:
    app: usms-enrolment
spec:
  type: ClusterIP
  selector:
    app: usms-enrolment
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Exercise 4 - ENFORCED: a voluntary disruption (kubectl drain, node-group upgrade)
# may never evict an enrolment pod if that would leave fewer than 1 ready.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: usms-enrolment-pdb
  namespace: usms
  labels:
    app: usms-enrolment
    project: usms
    tier: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: usms-enrolment
